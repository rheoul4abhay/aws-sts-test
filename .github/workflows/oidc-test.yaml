name: OIDC-Test-Debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Print Repository Context
        run: |
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch Ref : $GITHUB_REF"
          echo "Actor      : $GITHUB_ACTOR"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify AWS CLI
        run: |
          aws --version

      - name: Debug
        run: |
          echo "Repository=$GITHUB_REPOSITORY"
          echo "Ref=$GITHUB_REF"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::428890020190:role/github-actions-role
          aws-region: ap-south-1
          role-session-name: github-actions-debug

      - name: Verify Identity
        run: |
          aws sts get-caller-identity

      - name: List S3 Buckets
        run: |
          aws s3 ls || true
